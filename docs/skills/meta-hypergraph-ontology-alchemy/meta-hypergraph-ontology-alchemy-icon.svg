<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128" fill="none" role="img" aria-label="Meta-Hypergraph Ontology Alchemy" aria-labelledby="title desc">
  <title id="title">Meta-Hypergraph Ontology Alchemy</title>
  <desc id="desc">Mirrored Axis. Vertical axis from L-16 (bottom) through L0 (center diamond) to L+16 (top). Four mirror pairs pulse outward from center: L±1 (cyan/violet), L±2 (cyan/violet), L±3 (orange, desynchronized — special return role), L±4 (cyan/violet). After all four pairs, L0 diamond flashes amber = potentiality becomes the requested conceptual artifact. Cycle 16s.</desc>

  <!-- Family invariants -->
  <circle cx="32" cy="32" r="30" fill="#0B0F1A"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="44s" repeatCount="indefinite"/>
    <circle cx="32" cy="32" r="30" stroke="#4B5563" stroke-width="0.7" stroke-dasharray="1.5 2.5" opacity="0.45"/>
  </g>
  <circle cx="32" cy="32" r="28" stroke="#6366F1" stroke-width="0.4" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Vertical axis (L-16 to L+16, dashed) -->
  <line x1="32" y1="3" x2="32" y2="61" stroke="#4B5563" stroke-width="0.25" stroke-dasharray="0.4 1.2" opacity="0.35"/>

  <!-- Endpoint markers -->
  <circle cx="32" cy="3" r="0.5" fill="#4B5563" opacity="0.6"/>
  <circle cx="32" cy="61" r="0.5" fill="#4B5563" opacity="0.6"/>

  <!-- Pair 1: L+1 (y=24) / L-1 (y=40) — first distinction -->
  <circle cx="32" cy="24" r="1.2" fill="#22D3EE" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.03;0.05;0.13;0.15;1" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="40" r="1.2" fill="#A78BFA" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.03;0.05;0.13;0.15;1" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- Pair 2: L+2 (y=18) / L-2 (y=46) — relations vs negation of potentiality -->
  <circle cx="32" cy="18" r="1.2" fill="#22D3EE" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.17;0.19;0.27;0.29;1" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="46" r="1.2" fill="#A78BFA" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.17;0.19;0.27;0.29;1" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- Pair 3: L+3 (y=12) / L-3 (y=50) — ASYMMETRIC: orange + desynchronized pulse -->
  <!-- L+3 pulses first -->
  <circle cx="32" cy="12" r="1.3" fill="#FB923C" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.31;0.33;0.41;0.43;1" dur="16s" repeatCount="indefinite"/>
  </circle>
  <!-- L-3 pulses delayed by 0.04 (special return role — not a simple negation) -->
  <circle cx="32" cy="50" r="1.3" fill="#FB923C" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.35;0.37;0.45;0.47;1" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- Pair 4: L+4 (y=7) / L-4 (y=57) — cycles vs non-repetition -->
  <circle cx="32" cy="7" r="1.2" fill="#22D3EE" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.49;0.51;0.59;0.61;1" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="57" r="1.2" fill="#A78BFA" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35" keyTimes="0;0.49;0.51;0.59;0.61;1" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- L0: family diamond at center (potentiality) -->
  <g transform="rotate(45 32 32)">
    <rect x="28.5" y="28.5" width="7" height="7" fill="#312E81" stroke="#818CF8" stroke-width="0.85">
      <animate attributeName="fill" values="#312E81;#4338CA;#312E81" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#818CF8;#C7D2FE;#818CF8" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Amber flash: L0 becomes the requested conceptual artifact -->
  <g transform="rotate(45 32 32)">
    <rect x="28.5" y="28.5" width="7" height="7" fill="#F59E0B" stroke="#FBBF24" stroke-width="0.9" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0.9;0.9;0;0"
        keyTimes="0;0.61;0.65;0.73;0.76;1"
        dur="16s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Amber halo: artifact emergence -->
  <circle cx="32" cy="32" r="6" fill="none" stroke="#F59E0B" stroke-width="0.4" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0.8;0;0" keyTimes="0;0.61;0.65;0.73;0.76;1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="r" values="6;6;9;9;6;6" keyTimes="0;0.61;0.65;0.73;0.76;1" dur="16s" repeatCount="indefinite"/>
  </circle>
</svg>
