<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128" fill="none" role="img" aria-label="JEPA–Platonic MMSS Meta-Unifier" aria-labelledby="title desc">
  <title id="title">JEPA–Platonic MMSS Meta-Unifier</title>
  <desc id="desc">Corona Synchronization archetype. Five parent synthesizers (circles with orientation indicators) represent the family being unified. Each starts with a different "view angle" (scattered orientations). Over 16s all orientations rotate to vertical alignment, signifying Platonic convergence up to rotation. Central diamond flashes when aligned; amber output appears at bottom = unified skill/contract. Represents N parents → 1 shared latent representation.</desc>

  <!-- Family invariant: background -->
  <circle cx="32" cy="32" r="30" fill="#0B0F1A"/>

  <!-- Family invariant: dashed boundary (44s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="44s" repeatCount="indefinite"/>
    <circle cx="32" cy="32" r="30" stroke="#4B5563" stroke-width="0.7" stroke-dasharray="1.5 2.5" opacity="0.45"/>
  </g>

  <!-- Family invariant: halo (3s) -->
  <circle cx="32" cy="32" r="28" stroke="#6366F1" stroke-width="0.4" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 5 parents on top arc: -72°, -36°, 0°, +36°, +72° at r=22 -->
  <!-- Each has a base orientation line (vertical) + rotation animation from scattered to aligned -->

  <!-- Parent 0: (11.1, 25.2) — starts -30°, aligns 0° -->
  <g>
    <circle cx="11.1" cy="25.2" r="1.3" fill="#A78BFA"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-30 11.1 25.2; -30 11.1 25.2; 0 11.1 25.2; 0 11.1 25.2; -30 11.1 25.2; -30 11.1 25.2"
        keyTimes="0; 0.15; 0.48; 0.70; 0.85; 1"
        dur="16s" repeatCount="indefinite"/>
      <line x1="11.1" y1="25.2" x2="11.1" y2="28.2" stroke="#A78BFA" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <!-- Parent 1: (19.1, 14.2) — starts +20°, aligns 0° -->
  <g>
    <circle cx="19.1" cy="14.2" r="1.3" fill="#22D3EE"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="20 19.1 14.2; 20 19.1 14.2; 0 19.1 14.2; 0 19.1 14.2; 20 19.1 14.2; 20 19.1 14.2"
        keyTimes="0; 0.15; 0.48; 0.70; 0.85; 1"
        dur="16s" repeatCount="indefinite"/>
      <line x1="19.1" y1="14.2" x2="19.1" y2="17.2" stroke="#22D3EE" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <!-- Parent 2: (32, 10) — reference, always aligned -->
  <g>
    <circle cx="32" cy="10" r="1.3" fill="#A78BFA"/>
    <line x1="32" y1="10" x2="32" y2="13" stroke="#A78BFA" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Parent 3: (44.9, 14.2) — starts -15°, aligns 0° -->
  <g>
    <circle cx="44.9" cy="14.2" r="1.3" fill="#22D3EE"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-15 44.9 14.2; -15 44.9 14.2; 0 44.9 14.2; 0 44.9 14.2; -15 44.9 14.2; -15 44.9 14.2"
        keyTimes="0; 0.15; 0.48; 0.70; 0.85; 1"
        dur="16s" repeatCount="indefinite"/>
      <line x1="44.9" y1="14.2" x2="44.9" y2="17.2" stroke="#22D3EE" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <!-- Parent 4: (52.9, 25.2) — starts +35°, aligns 0° -->
  <g>
    <circle cx="52.9" cy="25.2" r="1.3" fill="#A78BFA"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="35 52.9 25.2; 35 52.9 25.2; 0 52.9 25.2; 0 52.9 25.2; 35 52.9 25.2; 35 52.9 25.2"
        keyTimes="0; 0.15; 0.48; 0.70; 0.85; 1"
        dur="16s" repeatCount="indefinite"/>
      <line x1="52.9" y1="25.2" x2="52.9" y2="28.2" stroke="#A78BFA" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <!-- Convergence flash at center when all align -->
  <circle cx="32" cy="32" r="1" fill="#E0E7FF" opacity="0">
    <animate attributeName="opacity" values="0; 0; 0.9; 0.9; 0; 0" keyTimes="0; 0.46; 0.50; 0.54; 0.60; 1" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1; 1; 4; 7; 1; 1" keyTimes="0; 0.46; 0.50; 0.54; 0.60; 1" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- Central diamond: shared abstract space (family invariant) -->
  <g transform="rotate(45 32 32)">
    <rect x="28.5" y="28.5" width="7" height="7" fill="#312E81" stroke="#818CF8" stroke-width="0.85">
      <animate attributeName="fill" values="#312E81;#312E81;#4338CA;#4338CA;#312E81;#312E81" keyTimes="0; 0.46; 0.50; 0.62; 0.72; 1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#818CF8;#818CF8;#C7D2FE;#C7D2FE;#818CF8;#818CF8" keyTimes="0; 0.46; 0.50; 0.62; 0.72; 1" dur="16s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Path to output -->
  <line x1="32" y1="38" x2="32" y2="48" stroke="#4B5563" stroke-width="0.5"/>

  <!-- Amber output: unified skill/contract -->
  <g transform="rotate(45 32 55)">
    <rect x="29.5" y="52.5" width="5" height="5" fill="#1F1E4A" stroke="#4C488F" stroke-width="0.7">
      <animate attributeName="fill" values="#1F1E4A;#1F1E4A;#F59E0B;#F59E0B;#1F1E4A;#1F1E4A" keyTimes="0; 0.52; 0.62; 0.80; 0.90; 1" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#4C488F;#4C488F;#FBBF24;#FBBF24;#4C488F;#4C488F" keyTimes="0; 0.52; 0.62; 0.80; 0.90; 1" dur="16s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
