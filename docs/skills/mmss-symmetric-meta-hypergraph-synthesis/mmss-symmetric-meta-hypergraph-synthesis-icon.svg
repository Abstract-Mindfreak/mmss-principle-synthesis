<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128" fill="none" role="img" aria-label="Symmetric Meta-Hypergraph Synthesis" aria-labelledby="title desc">
  <title id="title">Symmetric Meta-Hypergraph Synthesis</title>
  <desc id="desc">Extraction with Reference Overlay. Left: source material (cyan wavy streams) enters horizontally. Center: extraction kernel (family diamond) with a FAINT vertical reference axis (L-16→L+16, dotted, dim) overlaid as an optional coordinate system — not a mandate. Right: portable kernel (violet dots) separates from reference anchors (dim). Far right: amber SKILL.md output. Seven operation-mode dots at top rotate one active at a time. Cycle 14s.</desc>

  <!-- Family invariants -->
  <circle cx="32" cy="32" r="30" fill="#0B0F1A"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="44s" repeatCount="indefinite"/>
    <circle cx="32" cy="32" r="30" stroke="#4B5563" stroke-width="0.7" stroke-dasharray="1.5 2.5" opacity="0.45"/>
  </g>
  <circle cx="32" cy="32" r="28" stroke="#6366F1" stroke-width="0.4" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- FAINT REFERENCE AXIS (vertical, optional, dotted) -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#4B5563" stroke-width="0.2" stroke-dasharray="0.4 1.4" opacity="0.35"/>
  <!-- Axis endpoint markers (very faint, "available, not required") -->
  <circle cx="32" cy="4" r="0.35" fill="#4B5563" opacity="0.5"/>
  <circle cx="32" cy="60" r="0.35" fill="#4B5563" opacity="0.5"/>
  <!-- Two faint reference ticks (represent L±n) -->
  <circle cx="32" cy="18" r="0.4" fill="#4B5563" opacity="0.55"/>
  <circle cx="32" cy="46" r="0.4" fill="#4B5563" opacity="0.55"/>

  <!-- SOURCE MATERIAL (left, cyan wavy) -->
  <g stroke="#22D3EE" stroke-width="0.4" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M 3 27 q 1 1.5 0 3 q 1 1.5 0 3 q 1 1.5 0 3">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 5 27 q 1 1.5 0 3 q 1 1.5 0 3 q 1 1.5 0 3">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 7 27 q 1 1.5 0 3 q 1 1.5 0 3 q 1 1.5 0 3">
      <animate attributeName="opacity" values="0.6;0.85;0.6" dur="2.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Compression/extraction arrow -->
  <line x1="9" y1="32" x2="22" y2="32" stroke="#22D3EE" stroke-width="0.4" opacity="0.55"/>
  <polygon points="22,31.1 22,32.9 23.5,32" fill="#22D3EE" opacity="0.7"/>
  <circle cx="9" cy="32" r="0.5" fill="#E0E7FF">
    <animate attributeName="cx" values="9;23;23;9" keyTimes="0;0.14;0.30;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0;1" keyTimes="0;0.04;0.14;0.30;1" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Extraction family diamond (kernel) -->
  <g transform="rotate(45 32 32)">
    <rect x="28.5" y="28.5" width="7" height="7" fill="#312E81" stroke="#818CF8" stroke-width="0.85">
      <animate attributeName="fill" values="#312E81;#4338CA;#312E81" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#818CF8;#C7D2FE;#818CF8" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Extraction pulse ring: diamond meets source -->
  <circle cx="32" cy="32" r="5" stroke="#E0E7FF" stroke-width="0.4" fill="none" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.14;0.18;0.24;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;5;8;8;5" keyTimes="0;0.14;0.18;0.24;1" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Arrow: extraction → output -->
  <line x1="40" y1="32" x2="48" y2="32" stroke="#4B5563" stroke-width="0.4">
    <animate attributeName="stroke" values="#4B5563;#4B5563;#A78BFA;#A78BFA;#4B5563" keyTimes="0;0.22;0.28;0.62;0.68" dur="14s" repeatCount="indefinite"/>
  </line>
  <polygon points="48,31.1 48,32.9 49.5,32" fill="#4B5563">
    <animate attributeName="fill" values="#4B5563;#4B5563;#A78BFA;#A78BFA;#4B5563" keyTimes="0;0.22;0.28;0.62;0.68" dur="14s" repeatCount="indefinite"/>
  </polygon>

  <!-- PORTABLE KERNEL: violet cluster (bright, active) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0.3" keyTimes="0;0.28;0.34;0.62;0.72" dur="14s" repeatCount="indefinite"/>
    <circle cx="52" cy="29" r="0.6" fill="#A78BFA"/>
    <circle cx="53.5" cy="31" r="0.6" fill="#A78BFA"/>
    <circle cx="52" cy="33" r="0.6" fill="#A78BFA"/>
    <circle cx="50.5" cy="31" r="0.6" fill="#A78BFA"/>
    <circle cx="52" cy="31" r="0.7" fill="#E0E7FF"/>
  </g>

  <!-- REFERENCE ANCHORS: dim gray dots (optional, kept but not primary) -->
  <g opacity="0.35">
    <circle cx="55" cy="22" r="0.4" fill="#6B7280"/>
    <circle cx="57" cy="32" r="0.4" fill="#6B7280"/>
    <circle cx="55" cy="42" r="0.4" fill="#6B7280"/>
  </g>

  <!-- Arrow: kernel → artifact -->
  <line x1="58" y1="32" x2="56" y2="32" stroke="#4B5563" stroke-width="0.3" opacity="0"/>

  <!-- AMBER OUTPUT: requested artifact (SKILL.md or other) -->
  <g transform="rotate(45 52 50)">
    <rect x="49.5" y="47.5" width="5" height="5" fill="#1F1E4A" stroke="#4C488F" stroke-width="0.7">
      <animate attributeName="fill" values="#1F1E4A;#1F1E4A;#F59E0B;#F59E0B;#1F1E4A" keyTimes="0;0.66;0.72;0.88;0.96" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#4C488F;#4C488F;#FBBF24;#FBBF24;#4C488F" keyTimes="0;0.66;0.72;0.88;0.96" dur="14s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Line: kernel position → output diamond -->
  <line x1="52" y1="37" x2="52" y2="46" stroke="#4B5563" stroke-width="0.3">
    <animate attributeName="stroke" values="#4B5563;#4B5563;#A78BFA;#A78BFA;#4B5563" keyTimes="0;0.28;0.34;0.62;0.68" dur="14s" repeatCount="indefinite"/>
  </line>

  <!-- 7 OPERATION MODE DOTS at top (rotate: one active per phase) -->
  <circle cx="12" cy="3" r="0.5" fill="#4B5563">
    <animate attributeName="r" values="0.5;0.5;0.9;0.9;0.5;0.5" keyTimes="0;0.02;0.04;0.11;0.13;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B5563;#4B5563;#22D3EE;#22D3EE;#4B5563;#4B5563" keyTimes="0;0.02;0.04;0.11;0.13;1" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="19" cy="3" r="0.5" fill="#4B5563">
    <animate attributeName="r" values="0.5;0.5;0.9;0.9;0.5;0.5" keyTimes="0;0.16;0.18;0.25;0.27;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B5563;#4B5563;#A78BFA;#A78BFA;#4B5563;#4B5563" keyTimes="0;0.16;0.18;0.25;0.27;1" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="26" cy="3" r="0.5" fill="#4B5563">
    <animate attributeName="r" values="0.5;0.5;0.9;0.9;0.5;0.5" keyTimes="0;0.30;0.32;0.39;0.41;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B5563;#4B5563;#34D399;#34D399;#4B5563;#4B5563" keyTimes="0;0.30;0.32;0.39;0.41;1" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="33" cy="3" r="0.5" fill="#4B5563">
    <animate attributeName="r" values="0.5;0.5;0.9;0.9;0.5;0.5" keyTimes="0;0.44;0.46;0.53;0.55;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B5563;#4B5563;#FB923C;#FB923C;#4B5563;#4B5563" keyTimes="0;0.44;0.46;0.53;0.55;1" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="3" r="0.5" fill="#4B5563">
    <animate attributeName="r" values="0.5;0.5;0.9;0.9;0.5;0.5" keyTimes="0;0.58;0.60;0.67;0.69;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B5563;#4B5563;#F59E0B;#F59E0B;#4B5563;#4B5563" keyTimes="0;0.58;0.60;0.67;0.69;1" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="47" cy="3" r="0.5" fill="#4B5563">
    <animate attributeName="r" values="0.5;0.5;0.9;0.9;0.5;0.5" keyTimes="0;0.72;0.74;0.81;0.83;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B5563;#4B5563;#E0E7FF;#E0E7FF;#4B5563;#4B5563" keyTimes="0;0.72;0.74;0.81;0.83;1" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="54" cy="3" r="0.5" fill="#4B5563">
    <animate attributeName="r" values="0.5;0.5;0.9;0.9;0.5;0.5" keyTimes="0;0.86;0.88;0.95;0.97;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B5563;#4B5563;#818CF8;#818CF8;#4B5563;#4B5563" keyTimes="0;0.86;0.88;0.95;0.97;1" dur="14s" repeatCount="indefinite"/>
  </circle>
</svg>
