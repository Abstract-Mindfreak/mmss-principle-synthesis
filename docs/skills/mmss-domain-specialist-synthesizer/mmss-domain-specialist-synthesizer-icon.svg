<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128" fill="none" role="img" aria-label="MMSS Domain Specialist Synthesizer" aria-labelledby="title desc">
  <title id="title">MMSS Domain Specialist Synthesizer</title>
  <desc id="desc">Gate Ladder archetype. 6 profile dots at top (one active violet = selected domain profile). Material particle descends through 7 verification gates G0–G6. Applicable gates pulse cyan→green (5 gates: verified); non-applicable gates stay dim (2 gates: G4 Robustness, G6 Application N/A for this profile). Particle passes through family diamond at center. Amber output diamond at bottom = synthesized SKILL.md. Cycle 18s.</desc>

  <!-- Family invariant: background -->
  <circle cx="32" cy="32" r="30" fill="#0B0F1A"/>

  <!-- Family invariant: dashed boundary (44s) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="44s" repeatCount="indefinite"/>
    <circle cx="32" cy="32" r="30" stroke="#4B5563" stroke-width="0.7" stroke-dasharray="1.5 2.5" opacity="0.45"/>
  </g>

  <!-- Family invariant: halo (3s) -->
  <circle cx="32" cy="32" r="28" stroke="#6366F1" stroke-width="0.4" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Profile selector: 6 dots, one active (representing 6 profiles) -->
  <g>
    <circle cx="14" cy="4" r="0.6" fill="#4B5563" opacity="0.6"/>
    <circle cx="21" cy="4" r="0.7" fill="#A78BFA">
      <animate attributeName="r" values="0.7;0.9;0.7" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="4" r="0.6" fill="#4B5563" opacity="0.6"/>
    <circle cx="36" cy="4" r="0.6" fill="#4B5563" opacity="0.6"/>
    <circle cx="43" cy="4" r="0.6" fill="#4B5563" opacity="0.6"/>
    <circle cx="50" cy="4" r="0.6" fill="#4B5563" opacity="0.6"/>
  </g>

  <!-- === G0 Concept: applicable, y=8 === -->
  <line x1="16" y1="8" x2="48" y2="8" stroke="#4B5563" stroke-width="0.6" opacity="0.4">
    <animate attributeName="stroke" values="#4B5563;#4B5563;#22D3EE;#34D399;#4B5563;#4B5563" keyTimes="0;0.10;0.12;0.15;0.18;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.10;0.12;0.15;0.18;1" dur="18s" repeatCount="indefinite"/>
  </line>

  <!-- === G1 Rationale: applicable, y=13 === -->
  <line x1="16" y1="13" x2="48" y2="13" stroke="#4B5563" stroke-width="0.6" opacity="0.4">
    <animate attributeName="stroke" values="#4B5563;#4B5563;#22D3EE;#34D399;#4B5563;#4B5563" keyTimes="0;0.22;0.24;0.27;0.30;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.22;0.24;0.27;0.30;1" dur="18s" repeatCount="indefinite"/>
  </line>

  <!-- === G2 Qualification: applicable, y=18 === -->
  <line x1="16" y1="18" x2="48" y2="18" stroke="#4B5563" stroke-width="0.6" opacity="0.4">
    <animate attributeName="stroke" values="#4B5563;#4B5563;#22D3EE;#34D399;#4B5563;#4B5563" keyTimes="0;0.34;0.36;0.39;0.42;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.34;0.36;0.39;0.42;1" dur="18s" repeatCount="indefinite"/>
  </line>

  <!-- === G3 Check: applicable, y=23 === -->
  <line x1="16" y1="23" x2="48" y2="23" stroke="#4B5563" stroke-width="0.6" opacity="0.4">
    <animate attributeName="stroke" values="#4B5563;#4B5563;#22D3EE;#34D399;#4B5563;#4B5563" keyTimes="0;0.46;0.48;0.51;0.54;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.46;0.48;0.51;0.54;1" dur="18s" repeatCount="indefinite"/>
  </line>

  <!-- === G4 Robustness: N/A for this profile, stays dim, y=41 === -->
  <line x1="16" y1="41" x2="48" y2="41" stroke="#4B5563" stroke-width="0.6" opacity="0.25"/>

  <!-- === G5 Integration: applicable, y=46 === -->
  <line x1="16" y1="46" x2="48" y2="46" stroke="#4B5563" stroke-width="0.6" opacity="0.4">
    <animate attributeName="stroke" values="#4B5563;#4B5563;#22D3EE;#34D399;#4B5563;#4B5563" keyTimes="0;0.70;0.72;0.75;0.78;1" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.70;0.72;0.75;0.78;1" dur="18s" repeatCount="indefinite"/>
  </line>

  <!-- === G6 Application: N/A for this profile, stays dim, y=51 === -->
  <line x1="16" y1="51" x2="48" y2="51" stroke="#4B5563" stroke-width="0.6" opacity="0.25"/>

  <!-- Family invariant: central diamond at y=32 -->
  <g transform="rotate(45 32 32)">
    <rect x="28.5" y="28.5" width="7" height="7" fill="#312E81" stroke="#818CF8" stroke-width="0.85">
      <animate attributeName="fill" values="#312E81;#4338CA;#312E81" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#818CF8;#C7D2FE;#818CF8" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Material particle: descends, passes through diamond, reaches output -->
  <circle r="1.3" fill="#A78BFA">
    <animate attributeName="cy" values="6;8;13;18;23;32;41;46;51;57"
      keyTimes="0;0.10;0.22;0.34;0.46;0.52;0.58;0.70;0.82;0.95"
      dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0"
      keyTimes="0;0.02;0.93;0.95;1" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Output: SKILL.md amber diamond at y=57 -->
  <g transform="rotate(45 32 57)">
    <rect x="29.5" y="54.5" width="5" height="5" fill="#1F1E4A" stroke="#4C488F" stroke-width="0.7">
      <animate attributeName="fill" values="#1F1E4A;#1F1E4A;#F59E0B;#F59E0B;#1F1E4A"
        keyTimes="0;0.95;0.97;0.99;1" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#4C488F;#4C488F;#FBBF24;#FBBF24;#4C488F"
        keyTimes="0;0.95;0.97;0.99;1" dur="18s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
