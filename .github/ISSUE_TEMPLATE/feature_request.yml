name: Feature request
description: Propose a small, reasoned improvement.
title: "[Feature]: "
body:
  - type: input
    id: version
    attributes:
      label: Skill version
      placeholder: "0.1.4"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Task or problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and rationale
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and compatibility impact
  - type: textarea
    id: checks
    attributes:
      label: Checks performed and limitations
